# dsh-lan-access bundle patch.
#
# THE ROWS ARE NOT PATCHED. The plugin owns the `webserver` and `connection`
# rows at RUNTIME only (see lib/index.js): on activation it rewrites their
# config through the loader (0.0.0.0 + the configured authorities, and the
# optional cookie lifetime), and on deactivation it restores them to exactly
# the config dsh-web-app's own layer declares. They stay the official rows,
# so:
#
#   - a dshmarket disable of this package writes `disabled: true` onto the
#     rows this package INSERTS — only `lan-access` below — and the official
#     webserver/connection rows remain untouched and fully alive (loopback
#     bind + the deployment's own trust fence: the plain dsh behavior);
#   - there is no service the official rows wait for, so a disabled plugin
#     can never leave the tree waiting forever (the boot-loop bug the
#     runtime-owned design exists to avoid);
#   - --host / --trusted-host invocations keep working when the plugin is
#     off: the restore writes the same `__jsExpr` nodes the official rows
#     declare, which the loader re-evaluates against the live services.
#
# The single row below is the disable target of dshmarket's toggle and the
# host of the whole plugin: settings namespace registration, Remote (the
# settings tab), the runtime row ownership, the noAuth patch and the wiring
# check. Activation order: this row injects `settings` and `loader`, both
# provided very early by the base layer, so it activates before the webserver
# rows finish — it happens to be created later than them, but it does not
# wait for them, and nothing waits for it.

- insert:
    - id: lan-access
      name: 'dsh-lan-access'
      inject: [settings, loader]
